<form nz-form [formGroup]="contactForm" nzLayout="vertical" (ngSubmit)="save()">
  <nz-form-item>
    <nz-form-label nzRequired>Full Name</nz-form-label>
    <nz-form-control nzErrorTip="Please enter full name">
      <input nz-input formControlName="fullName" placeholder="Enter full name" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired>Mobile</nz-form-label>
    <nz-form-control nzErrorTip="Enter valid 10 digit mobile number">
      <input nz-input formControlName="mobile" placeholder="Enter mobile number" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label>Email</nz-form-label>
    <nz-form-control nzErrorTip="Enter valid email">
      <input nz-input formControlName="email" placeholder="Enter email" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired>Contact Type</nz-form-label>
    <nz-form-control>
      <nz-select formControlName="contactType">
        <nz-option nzValue="Customer" nzLabel="Customer" />
        <nz-option nzValue="Supplier" nzLabel="Supplier" />
        <nz-option nzValue="Employee" nzLabel="Employee" />
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired>Status</nz-form-label>
    <nz-form-control>
      <nz-select formControlName="status">
        <nz-option nzValue="Active" nzLabel="Active" />
        <nz-option nzValue="Inactive" nzLabel="Inactive" />
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px">
    <button nz-button type="button">Cancel</button>

    <button nz-button nzType="primary" htmlType="submit">
      {{ contact ? 'Update' : 'Save' }}
    </button>
  </div>
</form>
